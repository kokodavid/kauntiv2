name: Claude code review

# Reviews every pull request against AGENTS.md and docs/code-review.md and
# posts inline comments. Needs the CLAUDE_CODE_OAUTH_TOKEN repo secret
# (created by running `/install-github-app` in Claude Code, or
# `claude setup-token`). Without the secret the job is skipped, not failed.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Skip notice
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::CLAUDE_CODE_OAUTH_TOKEN not set; Claude review skipped."

      - uses: anthropics/claude-code-action@v1
        if: env.HAS_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the code reviewer for Kaunti47 v2. Read AGENTS.md,
            docs/architecture.md and docs/code-review.md first; they are the
            rules. Review ONLY this PR's diff.

            Priorities, in order:
            1. Architecture: feature folder layout, layer boundaries,
               Riverpod-only state (@riverpod codegen, no ChangeNotifier /
               setState for business state), I/O only in data/.
            2. Correctness: async/await mistakes, null handling, disposed
               refs, missing error states, Supabase RLS assumptions.
            3. Bloat: files heading past 300 lines, widgets doing logic,
               duplicated code that belongs in core/.
            4. Tests: new application/data logic without tests.
            5. Tracking: docs/port-tracker.md updated when a feature moves.

            Post specific issues as inline comments on the lines concerned.
            Finish with ONE summary comment: verdict (approve / changes
            needed), blocking issues, non-blocking suggestions. Do not
            praise; be direct and concrete.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
