# Kaunti47 v2 static analysis. CI runs `flutter analyze --fatal-infos`, so
# every lint below blocks a merge. Architecture rules that the analyzer can't
# express live in tools/check_architecture.py.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    unused_import: error
    unused_element: error
    unused_local_variable: error
    dead_code: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
  plugins:
    - custom_lint

linter:
  rules:
    # Correctness
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - avoid_slow_async_io
    - avoid_type_to_string
    - cancel_subscriptions
    - close_sinks
    - discarded_futures
    - no_adjacent_strings_in_list
    - only_throw_errors
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - use_build_context_synchronously

    # Readability / consistency
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - sort_child_properties_last
    - unnecessary_await_in_return
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_super_parameters

# riverpod_lint (via custom_lint) runs with all rules on by default:
#   dart run custom_lint
