name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: Architecture guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard self-tests
        run: python3 -m unittest discover -s tools/tests

      - name: Architecture rules (tools/check_architecture.py)
        run: python3 tools/check_architecture.py

      - name: Baseline may only shrink
        if: github.event_name == 'pull_request'
        run: |
          git show "origin/${{ github.base_ref }}:tools/architecture_baseline.json" > /tmp/base_baseline.json 2>/dev/null || true
          python3 tools/check_architecture.py --no-grow-from /tmp/base_baseline.json

  flutter:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- '*.g.dart' || {
            echo "::error::Generated files are stale. Run: dart run build_runner build --delete-conflicting-outputs";
            exit 1;
          }

      - name: Analyze (infos are fatal)
        run: flutter analyze --fatal-infos

      - name: Riverpod lints
        run: dart run custom_lint

      - name: Tests
        run: flutter test
